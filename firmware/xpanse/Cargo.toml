[package]
edition = "2024"
name = "xpanse"
version = "0.1.0"
license = "GPL-3.0"

publish = false

[dependencies]
xpanse-api = { workspace = true }

embassy-embedded-hal = { workspace = true }
embassy-sync = { workspace = true }
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-rp = { workspace = true }
embassy-usb = { workspace = true }
embassy-net = { workspace = true }
embassy-net-wiznet = { workspace = true }
embassy-futures = { workspace = true }
embassy-usb-logger = { workspace = true }

defmt = { workspace = true }
defmt-rtt = { workspace = true }
fixed = { workspace = true }
fixed-macro = { workspace = true }

serde = { workspace = true }
serde-json-core = { workspace = true }

# for assign resources example
assign-resources = { workspace = true }

# cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
critical-section = { workspace = true }
panic-probe = { workspace = true }
display-interface-spi = { workspace = true }
embedded-graphics = { workspace = true }
slint = { workspace = true }
rgb = { workspace = true }
mipidsi = { workspace = true }
display-interface = { workspace = true }
byte-slice-cast = { workspace = true }
smart-leds = { workspace = true }
heapless = { workspace = true }
libm = { workspace = true }
usbd-hid = { workspace = true }
ti-adc-expander = { workspace = true }


embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-hal-bus = { workspace = true }
embedded-io-async = { workspace = true }
embedded-storage = { workspace = true }
embedded-alloc = { workspace = true }
static_cell = { workspace = true }
portable-atomic = { workspace = true }
log = { workspace = true }
embedded-sdmmc = { workspace = true }

# Drivers
test-driver = { workspace = true }
two-button-driver = { workspace = true }
four-button-driver = { workspace = true }
wardriving-driver = { workspace = true }
pn532-driver = { workspace = true }
keebxpansion = { workspace = true }
nfcxpansion = { workspace = true }
qwertyxpansion-driver = { workspace = true }
sensexpansion-driver = { workspace = true }
irxpansion-driver = { workspace = true }
microsdxpansion-driver = { workspace = true }
joystickxpansion-driver = { workspace = true }

# Apps (each behind an `app-*` feature flag)
doom-app = { workspace = true, optional = true }
button-logger = { workspace = true, optional = true }
cube-game = { workspace = true, optional = true }
neon-beat = { workspace = true, optional = true }
snake-game = { workspace = true, optional = true }
nes-emulator = { workspace = true, optional = true }

[features]
default = ["app-neon-beat", "app-snake-game"]
app-button-logger = ["dep:button-logger"]
app-cube-game = ["dep:cube-game"]
app-neon-beat = ["dep:neon-beat"]
app-snake-game = ["dep:snake-game"]
app-nes-emulator = ["dep:nes-emulator"]
app-doom = ["dep:doom-app"]

[build-dependencies]
slint-build = { workspace = true }

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/rp235x" },
]
